<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Joseph Suhail | Home</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
margin:0;
background:#0f0f10;
color:#f5f5f7;
}

header{
background:rgba(15,15,16,0.82);
backdrop-filter:blur(14px);
-webkit-backdrop-filter:blur(14px);
border-bottom:1px solid rgba(255,255,255,0.08);
padding:16px 28px;
position:sticky;
top:0;
}

.top-bar{
max-width:1180px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
}

.brand h1{
margin:0;
font-size:22px;
font-weight:600;
}

.brand p{
margin:3px 0 0 0;
font-size:13px;
color:#a1a1a6;
}

nav a{
color:#f5f5f7;
text-decoration:none;
margin-left:14px;
font-size:14px;
padding:8px 12px;
border-radius:999px;
}

nav a:hover{
background:rgba(255,255,255,0.08);
}

.hero{
max-width:900px;
margin:70px auto;
padding:0 20px;
text-align:center;
}

.hero-text{
max-width:720px;
margin:0 auto 32px auto;
font-size:20px;
line-height:1.5;
color:#c7c7cc;
}

.profile-wrap{
display:flex;
justify-content:center;
margin-top:30px;
}

.profile-card{
background:rgba(255,255,255,0.05);
border:1px solid rgba(255,255,255,0.10);
border-radius:30px;
padding:20px;
box-shadow:0 20px 50px rgba(0,0,0,0.35);
}

.profile-card img{
width:250px;
height:auto;
display:block;
border-radius:22px;
}

footer{
text-align:center;
padding:24px;
border-top:1px solid rgba(255,255,255,0.08);
color:#8e8e93;
font-size:14px;
margin-top:70px;
}

@media(max-width:700px){

.top-bar{
justify-content:center;
text-align:center;
}

nav{
margin-top:8px;
}

nav a{
margin:4px;
display:inline-block;
}

.hero-text{
font-size:18px;
}

.profile-card img{
width:210px;
}

}

</style>
</head>

<body>

<header>

<div class="top-bar">

<div class="brand">
<h1>Joseph Suhail</h1>
<p>Cybersecurity Student</p>
</div>

<nav>
<a href="index.html">Home</a>
<a href="about.html">About</a>
<a href="projects.html">Projects</a>
<a href="contact.html">Contact</a>
</nav>

</div>

</header>

<section class="hero">

<p class="hero-text">
I am Joseph Suhail, a cybersecurity student focused on developing skills in
network security, system protection, and technical problem solving through
coursework, projects, and continuous learning.
</p>

<div class="profile-wrap">
<div class="profile-card">
<img src="joseph.png" alt="Joseph Suhail">
</div>
</div>

</section>

<footer>
<p>© 2026 Joseph Suhail</p>
</footer>

</body>
</html>
