html{

*{

margin:0;
padding:0;
}

body{
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
background:
radial-gradient(circle at top left, rgba(65,95,255,0.16), transparent 28%),
radial-gradient(circle at 85% 20%, rgba(0,170,255,0.10), transparent 24%),
linear-gradient(135deg,#07080b,#0d1016,#12151d);
color:#f5f5f7;
line-height:1.6;
}

body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background-image:
linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);

opacity:0.14;
pointer-events:none;
z-index:0;
}

@keyframes gridMove{
0%{ transform:translateY(0); }
100%{ transform:translateY(40px); }
}

header, main, footer{
position:relative;
z-index:1;
}

a{
text-decoration:none;
color:inherit;
}

.container{
max-width:1200px;
margin:0 auto;
padding:0 22px;
}

header{
position:sticky;
top:0;
z-index:1000;
background:rgba(10,11,15,0.78);
backdrop-filter:blur(14px);
-webkit-backdrop-filter:blur(14px);
border-bottom:1px solid rgba(255,255,255,0.08);
}

.top-bar{
max-width:1200px;
margin:0 auto;
padding:16px 22px;
display:flex;
justify-content:space-between;
align-items:center;
gap:20px;
}

.brand h1{

font-weight:600;
}

justify-content:flex-end;
}

nav a{
font-size:14px;
padding:9px 13px;
border-radius:999px;
color:#e8e8ed;
transition:all 0.2s ease;
}

nav a:hover{
background:rgba(255,255,255,0.08);
transform:translateY(-1px);
}

nav a.active{
background:rgba(255,255,255,0.12);
border:1px solid rgba(255,255,255,0.06);
}

/* HERO (same as other pages) */
.page-hero{
padding:80px 0 28px 0;

.page-hero h2{

margin-bottom:16px;
}

.page-hero p{

}

/* RESUME CARD */
.resume-card{
background:linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.03));
border:1px solid rgba(255,255,255,0.08);
border-radius:30px;
padding:26px;
box-shadow:0 18px 45px rgba(0,0,0,0.28);
margin-top:18px;
}

/* PDF */
.resume-frame{
width:100%;
height:85vh;
border:none;
border-radius:20px;
margin-top:18px;
}

/* BUTTON */
.button-row{
display:flex;
gap:14px;
flex-wrap:wrap;
margin-top:10px;
}

.btn{
display:inline-flex;
align-items:center;
justify-content:center;
padding:13px 20px;
border-radius:999px;
font-size:15px;
font-weight:600;
transition:all 0.2s ease;
}

.btn-primary{
background:#f5f5f7;
color:#0d0e12;
}

.btn-primary:hover{
transform:translateY(-2px);
opacity:0.92;
}

footer{
margin-top:60px;
border-top:1px solid rgba(255,255,255,0.08);

@media(max-width:900px){

}

}

margin:0 auto;
